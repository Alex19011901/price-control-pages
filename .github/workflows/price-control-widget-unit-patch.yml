name: Price Control Widget Unit Patch

on:
  push:
    paths:
      - '.github/workflows/price-control-widget-unit-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch widget units
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('price-control/tracked-products-widget.js')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ("function money(v){", "function money(v,unit){"),
            ("return Number(v).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽/кг';", "return Number(v).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽/'+(unit||'кг');"),
            ("(last?money(last.fact):'—')", "(last?money(last.fact,p.unit):'—')"),
            ("money(x.pt.fact)+' · '+x.pt.supplier", "money(x.pt.fact,p.unit)+' · '+x.pt.supplier")
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit('Expected widget fragment not found: '+old)
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/tracked-products-widget.js
          git commit -m "Show tracked product prices in correct units"
          git push origin main
