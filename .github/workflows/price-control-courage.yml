name: Price Control Courage Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'price-control/courage_scan.js'
      - 'price-control/merge_courage_product.js'

permissions:
  contents: write

concurrency:
  group: price-control-courage-audit
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Restore DocsInBox session
        env:
          DXBX_STORAGE_STATE: ${{ secrets.DXBX_STORAGE_STATE }}
        run: |
          test -n "$DXBX_STORAGE_STATE" || { echo "DXBX_STORAGE_STATE is not configured"; exit 1; }
          printf '%s' "$DXBX_STORAGE_STATE" > /tmp/price-control-dxbx-state.json

      - name: Scan Courage cucumbers from 01.01.2026
        env:
          DOCSINBOX_STORAGE_STATE: /tmp/price-control-dxbx-state.json
        run: node price-control/courage_scan.js price-control/courage_audit.json

      - name: Merge Courage into tracked product index
        run: node price-control/merge_courage_product.js price-control/tracked_products.json price-control/courage_audit.json

      - name: Save Courage data
        run: |
          rm -f /tmp/price-control-dxbx-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/courage_audit.json price-control/tracked_products.json
          if git diff --cached --quiet; then
            echo "No Courage changes"
          else
            git commit -m "Update Courage cucumber data"
            git push origin main
          fi
