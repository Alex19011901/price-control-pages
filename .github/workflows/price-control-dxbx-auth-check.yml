name: Price Control DocsInBox Auth Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/price-control-dxbx-auth-check.yml"
      - "price-control/prepare_dxbx_auth.js"
      - "price-control/prepare_dxbx_auth.test.js"

permissions:
  contents: read

concurrency:
  group: price-control-public-refresh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test authentication safeguards
        run: node --test price-control/prepare_dxbx_auth.test.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Prepare autonomous DocsInBox login
        env:
          DXBX_STORAGE_STATE: ${{ secrets.DXBX_STORAGE_STATE }}
          DXBX_LOGIN: ${{ secrets.DXBX_LOGIN }}
          DXBX_PASSWORD: ${{ secrets.DXBX_PASSWORD }}
        run: node price-control/prepare_dxbx_auth.js /tmp/price-control-dxbx-auth-check.json
      - name: Verify saved login in an independent context
        run: |
          node <<'NODE'
          const {chromium} = require('playwright');
          const {verifySupplies} = require('./price-control/prepare_dxbx_auth');
          (async () => {
            const browser = await chromium.launch({headless: true});
            try {
              const context = await browser.newContext({storageState: '/tmp/price-control-dxbx-auth-check.json'});
              if (!await verifySupplies(context)) throw new Error('AUTH_REUSE_REJECTED');
              console.log('AUTH_REUSE_CONFIRMED HTTP 200');
            } finally { await browser.close(); }
          })().catch(() => {console.error('AUTH_REUSE_FAILED'); process.exitCode = 1;});
          NODE
      - name: Remove temporary session
        if: always()
        run: rm -f /tmp/price-control-dxbx-auth-check.json /tmp/price-control-dxbx-auth-check.json.*.tmp
