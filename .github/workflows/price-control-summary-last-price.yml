name: Price Control Summary Last Price

on:
  push:
    paths:
      - '.github/workflows/price-control-summary-last-price.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show latest supply date and price in tracked-product cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('price-control/tracked-products-widget.js')
          s = p.read_text(encoding='utf-8')
          old = """      const base=p.base||null;\n      return '<div class=\"tracked-summary-item\">'+\n        '<div class=\"tracked-summary-name\"><span class=\"tracked-swatch\" style=\"background:'+esc(p.color)+'\"></span>'+esc(p.label)+'</div>'+\n        '<div class=\"tracked-summary-value\">'+(last?fmt(last.index,1):'—')+'</div>'+\n        '<div class=\"tracked-summary-hint\">'+(last?esc(last.date)+' · '+esc(last.invoice):'Нет поставок')+'</div>'+\n        '<div class=\"tracked-summary-hint\">База: '+(base?esc(base.date)+' · '+money(base.fact):'—')+'</div>'+"""
          new = """      return '<div class=\"tracked-summary-item\">'+\n        '<div class=\"tracked-summary-name\"><span class=\"tracked-swatch\" style=\"background:'+esc(p.color)+'\"></span>'+esc(p.label)+'</div>'+\n        '<div class=\"tracked-summary-value\">'+(last?fmt(last.index,1):'—')+'</div>'+\n        '<div class=\"tracked-summary-hint\">Последняя поставка: '+(last?esc(last.date):'—')+'</div>'+\n        '<div class=\"tracked-summary-hint\">Последняя цена: '+(last?money(last.fact):'—')+'</div>'+"""
          if old not in s:
              raise SystemExit('Expected summary block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/tracked-products-widget.js
          git commit -m "Show latest tracked product supply price"
          git push origin main
