name: Price Control Public Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-control-public-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Restore DocsInBox session and validate prices
        env:
          DXBX_STORAGE_STATE: ${{ secrets.DXBX_STORAGE_STATE }}
        run: |
          test -n "$DXBX_STORAGE_STATE" || { echo "DXBX_STORAGE_STATE is not configured"; exit 1; }
          printf '%s' "$DXBX_STORAGE_STATE" > /tmp/price-control-dxbx-state.json
          cat price-control/price_20260826.parts/* > /tmp/price_20260826.json.gz.b64
          base64 --decode /tmp/price_20260826.json.gz.b64 | gzip -dc > price-control/price_20260826.json
          python - <<'PY'
          import json
          old = json.load(open("price-control/price_20260826.json", encoding="utf-8"))
          assert old.get("valid_on") == "2026-08-26"
          assert len(old.get("rows", [])) == 2170

          new = json.load(open("price-control/price_20260902.json", encoding="utf-8"))
          assert new.get("supplier") == "Парадис Экзотика"
          assert new.get("documentDate") == "02.09.2026"
          assert new.get("validFrom") == "03.09.2026"
          assert len(new.get("rows", [])) == 2161

          print("Price payloads OK:", len(old["rows"]), "old rows;", len(new["rows"]), "new rows")
          PY

      - name: Refresh DocsInBox data
        env:
          DOCSINBOX_STORAGE_STATE: /tmp/price-control-dxbx-state.json
        run: node price-control/refresh_dxbx.js price-control/current.json

      - name: Update full history
        run: python price-control/build_full_history.py

      - name: Save refreshed data
        run: |
          rm -f /tmp/price-control-dxbx-state.json price-control/price_20260826.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/current.json price-control/full.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Price Control data"
            git push origin main
          fi
