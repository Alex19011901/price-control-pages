name: Price Control Public Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-control-public-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Restore DocsInBox session and validate price
        env:
          DXBX_STORAGE_STATE: ${{ secrets.DXBX_STORAGE_STATE }}
        run: |
          test -n "$DXBX_STORAGE_STATE" || { echo "DXBX_STORAGE_STATE is not configured"; exit 1; }
          printf '%s' "$DXBX_STORAGE_STATE" > /tmp/price-control-dxbx-state.json
          python - <<'PY'
          import json
          p = "price-control/price_20260902.json"
          d = json.load(open(p, encoding="utf-8"))
          assert d.get("supplier") == "Парадис Экзотика"
          assert d.get("documentDate") == "02.09.2026"
          assert d.get("validFrom") == "03.09.2026"
          assert len(d.get("rows", [])) > 1000
          print("Price payload OK:", len(d["rows"]), "rows; valid from", d["validFrom"])
          PY

      - name: Refresh DocsInBox data
        env:
          DOCSINBOX_STORAGE_STATE: /tmp/price-control-dxbx-state.json
        run: node price-control/refresh_dxbx.js price-control/current.json

      - name: Update full history
        run: python price-control/build_full_history.py

      - name: Save refreshed data
        run: |
          rm -f /tmp/price-control-dxbx-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/current.json price-control/full.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Price Control data"
            git push origin main
          fi
