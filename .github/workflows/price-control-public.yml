name: Price Control Public Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - "price-control/refresh.trigger"

permissions:
  contents: write

concurrency:
  group: price-control-public-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Restore DocsInBox session and validate prices
        env:
          DXBX_STORAGE_STATE: ${{ secrets.DXBX_STORAGE_STATE }}
        run: |
          test -n "$DXBX_STORAGE_STATE" || { echo "DXBX_STORAGE_STATE is not configured"; exit 1; }
          printf '%s' "$DXBX_STORAGE_STATE" > /tmp/price-control-dxbx-state.json
          cat price-control/price_20260826.parts/* > /tmp/price_20260826.json.gz.b64
          base64 --decode /tmp/price_20260826.json.gz.b64 | gzip -dc > price-control/price_20260826.json
          cat price-control/price_20260910.fix.parts/* > /tmp/price_20260910.patch.json.gz.b64
          base64 --decode /tmp/price_20260910.patch.json.gz.b64 | gzip -dc > /tmp/price_20260910.patch.json
          python - <<'PY'
          import json
          import re

          old = json.load(open("price-control/price_20260826.json", encoding="utf-8"))
          assert old.get("valid_on") == "2026-08-26"
          assert len(old.get("rows", [])) == 2170

          mid = json.load(open("price-control/price_20260902.json", encoding="utf-8"))
          assert mid.get("supplier") == "Парадис Экзотика"
          assert mid.get("documentDate") == "02.09.2026"
          assert mid.get("validFrom") == "03.09.2026"
          assert len(mid.get("rows", [])) == 2161

          patch = json.load(open("/tmp/price_20260910.patch.json", encoding="utf-8"))
          assert patch.get("documentDate") == "10.09.2026"
          assert patch.get("validFrom") == "11.09.2026"
          assert patch.get("sourceFile") == "Эвенторс-2.pdf"
          assert len(patch.get("set", [])) == 486
          assert len(patch.get("remove", [])) == 12

          def norm(v):
              s = str(v or "").replace("\u00a0", " ").replace("ё", "е").lower()
              s = re.sub(r"^[!/*+\s]+", "", s)
              s = re.sub(r"\s+([,.;:])", r"\1", s)
              return re.sub(r"\s+", " ", s).strip()

          def key(r):
              return (norm(r.get("name", "")), norm(r.get("unit", "")))

          remove_keys = {key(r) for r in patch["remove"]}

          # One-off repair only for reconstructing the verified 10.09 payload.
          # These five 02.09 rows use obsolete keys that do not match their
          # authoritative 10.09 patch rows, so they must be dropped before set[].
          repair_drop = [
              {"name": "Консервация Томаты /Томаты вяленые Botanica 950г(ч/в 600г)1062мл ст/б", "unit": "шт"},
              {"name": "Масло растительное /Масло Растительное Нерафинированное ЗОЛОТАЯ СЕМЕЧКА 1л", "unit": "шт"},
              {"name": "/Мука для пиццы MOLINO GRASSI ОО 25 кг (из Мягких Сортов Пшеницы)", "unit": "шт"},
              {"name": "/Сосиски Молочные Егорьевские ( ~1.5кг) кг", "unit": "кг"},
              {"name": "/Томаты очищ целые в т/с Antica Napoli 2,5 кг ж/б", "unit": "шт"},
          ]
          repair_drop_keys = {key(r) for r in repair_drop}
          mid_keys = {key(r) for r in mid["rows"]}
          set_keys = {key(r) for r in patch["set"]}
          assert len(repair_drop_keys) == 5
          assert repair_drop_keys <= mid_keys, "Missing expected 02.09 reconstruction keys"
          assert not (repair_drop_keys & remove_keys), "Repair keys overlap authoritative removals"
          base_keys = mid_keys - remove_keys - repair_drop_keys
          assert len(set_keys - base_keys) == 10, "Unexpected 10.09 reconstruction key delta"

          rows = [
              dict(r)
              for r in mid["rows"]
              if key(r) not in remove_keys and key(r) not in repair_drop_keys
          ]
          index = {key(r): i for i, r in enumerate(rows)}
          for r in patch["set"]:
              k = key(r)
              clean = {"name": r["name"], "unit": r["unit"], "price": r["price"]}
              if k in index:
                  rows[index[k]] = clean
              else:
                  index[k] = len(rows)
                  rows.append(clean)

          new = {
              "supplier": "Парадис Экзотика",
              "documentDate": patch["documentDate"],
              "validFrom": patch["validFrom"],
              "sourceFile": patch["sourceFile"],
              "rows": rows,
          }
          keys = [key(r) for r in rows]
          assert len(rows) == 2154, len(rows)
          assert len(keys) == len(set(keys)), "Duplicate normalized name+unit keys in 10.09 price"
          controls = {key(r): r["price"] for r in rows}
          assert controls[("авокадо хаас стандарт", "кг")] == 887.0
          assert controls[("айсберг стандарт", "кг")] == 171.86
          assert controls[("ананас голд стандарт", "кг")] == 252.8
          assert controls[("базилик зеленый стандарт", "кг")] == 2499.69
          assert controls[("кабачки стандарт", "кг")] == 124.38
          assert controls[("кинза стандарт", "кг")] == 667.47
          assert controls[("огурцы кураж короткоплодные стандарт", "кг")] == 115.0
          with open("price-control/price_20260910.json", "w", encoding="utf-8") as f:
              json.dump(new, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Price payloads OK:", len(old["rows"]), "old rows;", len(mid["rows"]), "02.09 rows;", len(new["rows"]), "10.09 rows")
          PY

      - name: Refresh DocsInBox data
        env:
          DOCSINBOX_STORAGE_STATE: /tmp/price-control-dxbx-state.json
        run: node price-control/refresh_dxbx.js price-control/current.json

      - name: Update full history
        run: python price-control/build_full_history.py

      - name: Save refreshed data
        run: |
          rm -f /tmp/price-control-dxbx-state.json /tmp/price_20260910.patch.json /tmp/price_20260910.patch.json.gz.b64 price-control/price_20260826.json price-control/price_20260910.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/current.json price-control/full.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Price Control data"
            git push origin main
          fi
