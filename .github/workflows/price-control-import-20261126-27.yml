name: Price Control Import 26-27 November
on:
  push:
    paths:
      - ".github/workflows/price-control-import-20261126-27.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: price-control-mix-refresh
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate import scripts and last price list
        run: |
          node --check price-control/inspect_dxbx_today.js
          node --check price-control/import_20261126_27.js
          python -m py_compile price-control/import_20261126_27.py
          python price-control/verify_price_20261124.py
      - name: Use audited invoice snapshot from successful read-only check
        run: cp price-control/import_20261126_27_source.json /tmp/price-control-import-1126-27.json
      - name: Reconcile both invoices and update the histories
        run: |
          node price-control/import_20261126_27.js /tmp/price-control-import-1126-27.json
          python price-control/import_20261126_27.py /tmp/price-control-import-1126-27.json
          node --check price-control/refresh_dxbx.js
          node price-control/produce_test.js
          python price-control/verify_price_20261124.py
          python price-control/test_fresh_produce_scope.py
      - name: Save verified receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/mix_receipts.json price-control/mix_data.json price-control/produce_receipts.json price-control/current.json price-control/full.json price-control/invoice_price_slices.json price-control/build_full_history.py price-control/refresh_dxbx.js
          git diff --cached --stat
          git commit -m "Import verified November 26 and 27 receipts using the 24 November Aish price list"
          git push origin HEAD:main
      - name: Clean up authentication and temporary invoice data
        if: always()
        run: rm -f /tmp/price-control-import-1126-27-auth.json /tmp/price-control-import-1126-27-auth.json.*.tmp /tmp/price-control-import-1126-27.json
