name: Fix Price Control Refresh Monitor

on:
  push:
    paths:
      - '.github/workflows/fix-refresh-monitor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make dashboard refresh monitor resilient
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('price-control/draft.html')
          s = p.read_text(encoding='utf-8')
          old = """      const run=await waitForNewRun(beforeIds,deadline);\n      await waitForWorkflow(run.id,deadline);\n      setState('Сохранение новых данных…');\n      model=await waitForFreshFull(beforeGeneratedAt,deadline);"""
          new = """      let monitorError=null;\n      try{\n        const monitorDeadline=Math.min(deadline,Date.now()+90000);\n        const run=await waitForNewRun(beforeIds,monitorDeadline);\n        await waitForWorkflow(run.id,deadline);\n      }catch(e){\n        monitorError=e;\n        if(e&&e.code==='workflow_conclusion')throw e;\n        setState('Обновление запущено · ожидаю публикацию данных…');\n      }\n      setState('Сохранение новых данных…');\n      try{\n        model=await waitForFreshFull(beforeGeneratedAt,deadline);\n      }catch(e){\n        if(monitorError&&e&&e.code==='data_not_updated')throw monitorError;\n        throw e;\n      }"""
          if old not in s:
              raise SystemExit('Expected refresh monitor block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/draft.html
          git commit -m "Make dashboard refresh monitoring resilient"
          git push origin main
