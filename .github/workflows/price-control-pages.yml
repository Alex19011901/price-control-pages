name: Price Control Pages
# Publishes the dashboard without any client-side GitHub credential.

on:
  push:
    paths:
      - ".github/workflows/price-control-pages.yml"
      - "price-control/draft.html"
      - "price-control/trigger.html"
      - "price-control/current.json"
      - "price-control/full.json"
      - "price-control/purchase_history.json"
      - "price-control/tracked_products.json"
      - "price-control/tracked-products-widget.js"
      - "price-control/purchase-history-widget.js"
  workflow_run:
    workflows:
      - Price Control Public Refresh
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: price-control-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public site without credentials
        run: |
          mkdir -p public-site
          cp price-control/draft.html public-site/index.html
          cp price-control/draft.html public-site/price-control-draft.html
          cp price-control/current.json public-site/current.json
          cp price-control/full.json public-site/full.json
          cp price-control/purchase_history.json public-site/purchase_history.json
          cp price-control/tracked_products.json public-site/tracked_products.json
          cp price-control/tracked-products-widget.js public-site/tracked-products-widget.js
          cp price-control/purchase-history-widget.js public-site/purchase-history-widget.js
          cp price-control/trigger.html public-site/price-control-trigger.html
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from html.parser import HTMLParser

          workflow_url = "https://github.com/Alex19011901/price-control-pages/actions/workflows/price-control-public.yml"
          version = os.environ["GITHUB_SHA"]
          widget_scripts = [
              f'<script src="./purchase-history-widget.js?v={version[:12]}"></script>',
              '<script src="./tracked-products-widget.js"></script>',
          ]

          class RefreshLinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = 0
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id") == "refreshBtn":
                      if (tag != "a" or attrs.get("href") != workflow_url or
                          attrs.get("target") != "_blank" or
                          not {"noopener", "noreferrer"} <= set(attrs.get("rel", "").split())):
                          raise SystemExit("Unsafe refresh control")
                      self.links += 1

          for path in sorted(Path("public-site").glob("*.html")):
              html = path.read_text(encoding="utf-8")
              parser = RefreshLinkParser()
              parser.feed(html)
              if parser.links != 1:
                  raise SystemExit(f"Expected one GitHub refresh link in {path.name}")
              if path.name != "price-control-trigger.html":
                  for widget_script in widget_scripts:
                      if widget_script not in html:
                          if "</body>" not in html:
                              raise SystemExit(f"Closing body was not found in {path.name}")
                          html = html.replace("</body>", widget_script + "\n</body>", 1)
              path.write_text(html, encoding="utf-8")

          forbidden = re.compile(
              r"PUBLIC_REFRESH_TOKEN|DXBX_(?:LOGIN|PASSWORD|STORAGE_STATE)|"
              r"github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|"
              r"Authorization|/dispatches"
          )
          for path in sorted(Path("public-site").rglob("*")):
              if path.is_file() and forbidden.search(path.read_text(encoding="utf-8")):
                  raise SystemExit(f"Credential or client-side dispatch marker in {path.name}")

          for name in ("current.json", "full.json", "purchase_history.json", "tracked_products.json"):
              original = Path("price-control", name).read_bytes()
              if original != Path("public-site", name).read_bytes():
                  raise SystemExit(f"Data changed while publishing: {name}")
              json.loads(original)
          current = json.loads(Path("public-site/current.json").read_text(encoding="utf-8"))
          full = json.loads(Path("public-site/full.json").read_text(encoding="utf-8"))
          if current["week"]["key"] != full["currentKey"]:
              raise SystemExit("Current period mismatch")
          Path("public-site/deployment.json").write_text(
              json.dumps({"commit": version, "credentialsInSite": False}) + "\n", encoding="utf-8"
          )
          print("PUBLIC_SITE_SAFE: 3 refresh links; no credential markers; data unchanged")
          PY

      - name: Check public JavaScript syntax
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          for path in sorted(Path("public-site").glob("*.html")):
              html = path.read_text(encoding="utf-8")
              for script in re.findall(r"<script\b[^>]*>(.*?)</script>", html, re.S | re.I):
                  if script.strip():
                      with tempfile.NamedTemporaryFile(mode="w", suffix=".js", encoding="utf-8") as f:
                          f.write(script)
                          f.flush()
                          subprocess.run(["node", "--check", f.name], check=True)
          for path in sorted(Path("public-site").glob("*.js")):
              subprocess.run(["node", "--check", str(path)], check=True)
          print("PUBLIC_JAVASCRIPT_SYNTAX_OK")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages and preserved data
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          from pathlib import Path

          base = "https://alex19011901.github.io/price-control-pages/"
          revision = os.environ["GITHUB_SHA"]

          def read_public(name, suffix=""):
              request = urllib.request.Request(
                  base + name + "?verify=" + revision + suffix,
                  headers={"Cache-Control": "no-cache"},
              )
              # HTTP failures, rate limits and timeouts are not retried.
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise SystemExit(f"Unexpected HTTP status for {name}: {response.status}")
                  return response.read()

          for attempt in range(6):
              manifest = json.loads(read_public("deployment.json", "-" + str(attempt)))
              if manifest.get("commit") == revision:
                  break
              if attempt == 5:
                  raise SystemExit("Live Pages still serves an older deployment")
              time.sleep(5)

          forbidden = re.compile(
              r"PUBLIC_REFRESH_TOKEN|DXBX_(?:LOGIN|PASSWORD|STORAGE_STATE)|"
              r"github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|"
              r"Authorization|/dispatches"
          )
          checked = 0
          for path in sorted(Path("public-site").iterdir()):
              if not path.is_file():
                  continue
              actual = read_public(path.name)
              if actual != path.read_bytes():
                  raise SystemExit(f"Live content mismatch: {path.name}")
              if forbidden.search(actual.decode("utf-8")):
                  raise SystemExit(f"Unsafe marker in live content: {path.name}")
              checked += 1
          current = json.loads(Path("public-site/current.json").read_text(encoding="utf-8"))
          week = current["week"]
          summary = {k: week[k] for k in ("key", "docs", "rows", "above", "below", "equal", "unmatched", "overpay")}
          print("LIVE_PAGES_VERIFIED", json.dumps({"files": checked, "current": summary}))
          PY
