name: Price Control Pages

on:
  push:
    paths:
      - ".github/workflows/price-control-pages.yml"
      - "price-control/draft.html"
      - "price-control/trigger.html"
      - "price-control/current.json"
      - "price-control/full.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: price-control-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public site
        env:
          PUBLIC_REFRESH_TOKEN: ${{ secrets.PUBLIC_REFRESH_TOKEN }}
        run: |
          test -n "$PUBLIC_REFRESH_TOKEN" || { echo "PUBLIC_REFRESH_TOKEN is not configured"; exit 1; }
          mkdir -p public-site
          cp price-control/draft.html public-site/index.html
          cp price-control/draft.html public-site/price-control-draft.html
          cp price-control/current.json public-site/current.json
          cp price-control/full.json public-site/full.json
          cp price-control/trigger.html public-site/price-control-trigger.html
          python - <<'PY'
          import os
          from pathlib import Path

          token = os.environ.get("PUBLIC_REFRESH_TOKEN", "").strip()
          if not token:
              raise SystemExit("PUBLIC_REFRESH_TOKEN is not configured")
          placeholder = "__PUBLIC_REFRESH_TOKEN__"
          for path in [
              Path("public-site/index.html"),
              Path("public-site/price-control-draft.html"),
              Path("public-site/price-control-trigger.html"),
          ]:
              html = path.read_text(encoding="utf-8")
              if placeholder not in html:
                  raise SystemExit(f"Token placeholder was not found in {path}")
              path.write_text(html.replace(placeholder, token), encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
