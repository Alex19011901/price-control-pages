name: Price Control Build Tracked Products

on:
  push:
    paths:
      - 'price-control/tracked_products_audit.json'
      - 'price-control/build_tracked_products.js'
      - '.github/workflows/price-control-build-tracked-products.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-control-build-tracked-products
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build tracked product index
        run: node price-control/build_tracked_products.js price-control/tracked_products_audit.json price-control/tracked_products.json

      - name: Save tracked product index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/tracked_products.json
          if git diff --cached --quiet; then
            echo "No tracked-product changes"
          else
            git commit -m "Update tracked products index"
            git push origin main
          fi
