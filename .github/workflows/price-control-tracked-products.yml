name: Price Control Tracked Products Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Price Control Public Refresh
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: price-control-tracked-products-audit
  cancel-in-progress: true

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Restore DocsInBox session
        env:
          DXBX_STORAGE_STATE: ${{ secrets.DXBX_STORAGE_STATE }}
        run: |
          test -n "$DXBX_STORAGE_STATE" || { echo "DXBX_STORAGE_STATE is not configured"; exit 1; }
          printf '%s' "$DXBX_STORAGE_STATE" > /tmp/price-control-dxbx-state.json

      - name: Scan tracked products from 01.01.2026
        env:
          DOCSINBOX_STORAGE_STATE: /tmp/price-control-dxbx-state.json
        run: node price-control/tracked_products_scan.js price-control/tracked_products_audit.json

      - name: Build tracked product index
        run: node price-control/build_tracked_products.js price-control/tracked_products_audit.json price-control/tracked_products.json

      - name: Preserve Courage product
        run: |
          if [ -f price-control/courage_audit.json ] && [ -f price-control/merge_courage_product.js ]; then
            node price-control/merge_courage_product.js price-control/tracked_products.json price-control/courage_audit.json
          fi

      - name: Save tracked product data
        run: |
          rm -f /tmp/price-control-dxbx-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/tracked_products_audit.json price-control/tracked_products.json
          if git diff --cached --quiet; then
            echo "No tracked-product changes"
          else
            git commit -m "Update tracked products data"
            git push origin main
          fi
