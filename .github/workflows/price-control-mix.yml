name: Price Control Mix

on:
  push:
    paths:
      - ".github/workflows/price-control-mix.yml"
      - "price-control/mix_catalog.js"
      - "price-control/mix_scan.js"
      - "price-control/mix_build.js"
      - "price-control/prepare_dxbx_auth.js"
  workflow_run:
    workflows:
      - Price Control Public Refresh
    types:
      - completed
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-control-mix-refresh
  cancel-in-progress: true

jobs:
  mix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Mix catalog and JavaScript
        run: |
          node --check price-control/mix_catalog.js
          node --check price-control/mix_scan.js
          node --check price-control/mix_build.js
          node --check price-control/mix-widget.js
          node price-control/mix_catalog.js

      - name: Install Playwright and find hosted Chrome
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "Using hosted Google Chrome"
            echo "MIX_CHROME_EXECUTABLE=$CHROME_BIN" >> "$GITHUB_ENV"
          else
            echo "Hosted Chrome unavailable; installing Playwright Chromium"
            npx playwright install --with-deps chromium
          fi

      - name: Restore authenticated DocsInBox session
        env:
          DXBX_STORAGE_STATE: ${{ secrets.DXBX_STORAGE_STATE }}
          DXBX_LOGIN: ${{ secrets.DXBX_LOGIN }}
          DXBX_PASSWORD: ${{ secrets.DXBX_PASSWORD }}
        run: node price-control/prepare_dxbx_auth.js /tmp/price-control-mix-auth.json

      - name: Scan all suppliers and retain selected Mix items
        env:
          DOCSINBOX_STORAGE_STATE: /tmp/price-control-mix-auth.json
          MIX_CHROME_EXECUTABLE: ${{ env.MIX_CHROME_EXECUTABLE }}
        run: node price-control/mix_scan.js price-control/mix_receipts.json

      - name: Build Mix history and price index
        run: node price-control/mix_build.js price-control/mix_receipts.json price-control/mix_data.json

      - name: Validate Mix data before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path("price-control/mix_receipts.json").read_text())
          data=json.loads(Path("price-control/mix_data.json").read_text())
          assert raw["schemaVersion"]==1 and raw["invoiceErrors"]==0
          assert len(data["products"])==67 and len(data["groups"])==6
          assert len({p["id"] for p in data["products"]})==67
          assert data["stats"]["selectedProducts"]==67
          assert data["stats"]["matchedDeliveries"]>=0
          assert all(p["group"] in {g["id"] for g in data["groups"]} for p in data["products"])
          points=data["index"]["points"]
          assert all(p["value"]>0 and p["coverage"]>0 for p in points)
          assert all(a["dateIso"]<b["dateIso"] for a,b in zip(points,points[1:]))
          assert all(len(p["deliveries"])==p["count"] for p in data["products"])
          products={p["id"]:p for p in data["products"]}
          assert any(r["date"]=="10.11.2026" for r in products["butter_450"]["deliveries"])
          assert any(r["date"]=="22.10.2026" for r in products["butter_330"]["deliveries"])
          assert all(any(r["date"]==day for r in products["tiger_shrimp"]["deliveries"]) for day in ("12.11.2026","16.10.2026","06.10.2026"))
          egg_pack=[r for r in products["chicken_egg"]["deliveries"] if r["name"].startswith("180ШТ")]
          assert egg_pack and all(r.get("displayUnit")=="шт" and abs(r["displayFact"]-r["sum"]/r["indexQty"])<0.011 for r in egg_pack)
          assert all(r.get("displayUnit")=="шт" for r in products["quail_egg"]["deliveries"] if r.get("indexUnit")=="шт")
          assert data["stats"]["duplicateDocumentsRemoved"] >= 0
          assert products["feta"]["count"] > 0, "Missing feta/Sirtaki history from all suppliers"
          assert any("сиртак" in r["name"].lower() or "sirtaki" in r["name"].lower()
                     for r in products["feta"]["deliveries"]), "Sirtaki SKUs missing"
          assert len([r for r in products["tiger_shrimp"]["deliveries"] if r["date"]=="06.10.2026" and r["invoice"]=="ТД0610/0266"])==1

          new_product_ids=["beef_tenderloin","veal_cheeks","duck_fillet_oz500","duck_fillet_oz400","duck_fillet_myasko","duck_fillet_china","duck_fillet_other","duck_smoked_breast","duck_legs","turkey_fillet","parma_ham","beef_shoulder","pizza_sausages","tuna_fillet_1_10","tuna_saku_aaa","seabass","flounder","salmon_fillet","dorado","anchovies","cod_fillet","scallops","parmesan","suluguni","cremette","stracciatella","teriyaki","semola","wheat_flour","almond_flakes","sweet_peas","black_olives","green_olives","buckwheat","walnut","artichokes"]
          assert all(p in products for p in new_product_ids)
          for product_id in new_product_ids:
              if product_id not in {"veal_cheeks","duck_fillet_other"}:
                  assert products[product_id]["count"]>0, ("New Mix product missing from receipts",product_id)
          assert any("SAKU" in r["name"].upper() for r in products["tuna_saku_aaa"]["deliveries"])
          assert any("1/10" in r["name"] for r in products["tuna_fillet_1_10"]["deliveries"])
          assert any(r["date"]=="18.11.2026" for r in products["artichokes"]["deliveries"]) or products["artichokes"]["count"]>=6
          assert not any("МАКАРОН" in r["name"].upper() for r in products["scallops"]["deliveries"])
          assert not any("ИКРА" in r["name"].upper() for r in products["salmon_fillet"]["deliveries"])
          assert not any("МОЛОК" in r["name"].upper() for r in products["parmesan"]["deliveries"])
          if raw["invoices"]:
              assert points and data["stats"]["suppliers"]>0
          print("MIX_DATA_VERIFIED",data["stats"], "points",len(points))
          PY

      - name: Save Mix data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/mix_receipts.json price-control/mix_data.json
          if git diff --cached --quiet; then
            echo "No Mix changes"
          else
            git commit -m "Update all-supplier Mix purchase history and index"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Clean up session
        if: always()
        run: rm -f /tmp/price-control-mix-auth.json /tmp/price-control-mix-auth.json.*.tmp
