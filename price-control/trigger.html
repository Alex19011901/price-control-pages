<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Control Refresh</title>
</head>
<body>
<div id="status">Подготовка обновления…</div>
<script>
const PUBLIC_REFRESH_TOKEN='__PUBLIC_REFRESH_TOKEN__';
const OWNER='Alex19011901';
const REPO='price-control-pages';
const WORKFLOW='price-control-public.yml';
const REF='main';
const API='https://api.github.com/repos/'+OWNER+'/'+REPO;
const TIMEOUT_MS=20*60*1000;

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function report(status, detail, payload){
  const labels={
    dispatched:'Workflow запущен…',
    running:'Workflow выполняется…',
    saving:'Получение новых данных…',
    completed:'Обновление завершено',
    error:'Ошибка обновления'
  };
  document.getElementById('status').textContent=labels[status]||status;
  const message={
    source:'price-control-refresh',
    status:status,
    detail:detail||'',
    payload:payload||null,
    at:new Date().toISOString()
  };
  try{ parent.postMessage(message,'*'); }catch(e){}
  try{
    if(window.opener && !window.opener.closed) window.opener.postMessage(message,'*');
  }catch(e){}
}
async function gh(path, options){
  options=options||{};
  options.headers=Object.assign({
    'Authorization':'Bearer '+PUBLIC_REFRESH_TOKEN,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  },options.headers||{});
  options.cache='no-store';
  const res=await fetch(API+path,options);
  if(!res.ok)throw new Error('github_'+res.status);
  return res.status===204?null:res.json();
}
function decodeFile(file){
  const bin=atob(String(file.content||'').replace(/\s/g,''));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
async function readCurrent(){
  const f=await gh('/contents/price-control/current.json?ref='+encodeURIComponent(REF)+'&cb='+Date.now());
  return decodeFile(f);
}
async function listRuns(){
  const d=await gh('/actions/workflows/'+encodeURIComponent(WORKFLOW)+'/runs?branch='+encodeURIComponent(REF)+'&event=workflow_dispatch&per_page=20&cb='+Date.now());
  return d.workflow_runs||[];
}
async function waitForNewRun(beforeIds,deadline){
  while(Date.now()<deadline){
    const run=(await listRuns()).find(r=>!beforeIds.has(String(r.id)));
    if(run)return run;
    await sleep(3000);
  }
  throw new Error('workflow_run_not_found');
}
async function waitForWorkflowSuccess(runId,deadline){
  while(Date.now()<deadline){
    const run=await gh('/actions/runs/'+encodeURIComponent(runId)+'?cb='+Date.now());
    if(run.status==='completed'){
      if(run.conclusion==='success')return run;
      throw new Error('workflow_'+(run.conclusion||'failure'));
    }
    await sleep(5000);
  }
  throw new Error('workflow_timeout');
}
async function waitForFreshCurrent(beforeGeneratedAt,deadline){
  while(Date.now()<deadline){
    const payload=await readCurrent();
    const generatedAt=String(payload.generatedAt||'');
    if(generatedAt&&generatedAt!==beforeGeneratedAt)return payload;
    await sleep(3000);
  }
  throw new Error('data_not_updated');
}
(async function(){
  const deadline=Date.now()+TIMEOUT_MS;
  try{
    const beforePayload=await readCurrent();
    const beforeGeneratedAt=String(beforePayload.generatedAt||'');
    const beforeIds=new Set((await listRuns()).map(r=>String(r.id)));

    await gh('/actions/workflows/'+encodeURIComponent(WORKFLOW)+'/dispatches',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ref:REF})
    });
    report('dispatched');

    report('running');
    const run=await waitForNewRun(beforeIds,deadline);
    await waitForWorkflowSuccess(run.id,deadline);
    report('saving');
    const payload=await waitForFreshCurrent(beforeGeneratedAt,deadline);
    await sleep(1500);
    report('completed','',payload);
  }catch(e){
    report('error',String(e&&e.message||e||'unknown'));
  }
})();
</script>
</body>
</html>
